[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonshot-evidence-lab"
version = "0.1.0"
description = "Karpathy-style autoresearch scaffold for evidence synthesis and meta-analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
moonshot-evidence = "moonshot_evidence_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moonshot_evidence_lab*"]
